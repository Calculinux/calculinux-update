[build-system]
requires = ["hatchling>=1.17"]
build-backend = "hatchling.build"

[project]
name = "calculinux-update"
version = "0.1.0"
description = "CLI frontend for discovering and installing Calculinux RAUC update bundles"
readme = "README.md"
authors = [
  { name = "Calculinux" }
]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-mock>=3.14",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
calculinux-update = "calculinux_update.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/calculinux_update"]
include = [
  "src/calculinux_update/defaults/calculinux-update.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
